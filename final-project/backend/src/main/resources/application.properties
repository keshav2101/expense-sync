# ===================================================================
# ExpenseSync Core Service - Default Configuration (H2 Zero-Setup Mode)
# ===================================================================
server.port=8080
spring.application.name=core-service

# Active profile: 'h2' by default for instant evaluation; switch to 'mysql' when MySQL is running
spring.profiles.active=h2

# H2 In-Memory Database Configuration (MySQL Dialect Mode)
spring.datasource.url=jdbc:h2:mem:expensesync_core;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# JWT Secret & Expiration
expensesync.jwt.secret=9a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b
expensesync.jwt.expiration-ms=86400000

# Analytics Microservice URL (Port 8082)
analytics.service.url=http://localhost:8082/api/analytics
