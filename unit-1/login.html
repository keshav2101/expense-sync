<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ExpenseSync</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <!-- Header -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon">₹</span>
        <span>ExpenseSync</span>
      </a>
      <div class="nav-actions">
        <button id="themeToggleBtn" class="theme-btn" aria-label="Toggle theme">
          <span id="themeIcon">🌙</span>
          <span id="themeLabel">Dark</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Login Form Section -->
  <main class="auth-wrapper animate-fade-in">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Log in to access your expenses, groups, and balances.</p>
      </div>

      <form action="dashboard.html" method="GET" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email Address *</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="e.g. rahul@example.com" 
            required 
            autocomplete="email"
          >
          <span class="form-hint">We'll never share your email with anyone.</span>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label for="password" class="form-label" style="margin-bottom: 0;">Password *</label>
            <a href="#" style="font-size: 0.82rem;">Forgot password?</a>
          </div>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="Minimum 8 characters" 
            minlength="8" 
            required 
            autocomplete="current-password"
          >
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
          <input type="checkbox" id="rememberMe" name="rememberMe">
          <label for="rememberMe" style="font-size: 0.88rem; cursor: pointer; color: var(--text-secondary);">Remember me on this browser</label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Sign In to ExpenseSync
        </button>

        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
          Don't have an account? <a href="register.html">Create one here</a>
        </p>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-content">
      <p>© 2026 ExpenseSync - 21CSE354T Full Stack Web Development Project</p>
      <a href="index.html">← Back to Home</a>
    </div>
  </footer>

  <script src="js/canvas-chart.js"></script>
</body>
</html>
